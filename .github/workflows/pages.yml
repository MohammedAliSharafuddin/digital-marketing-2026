name: Render and publish

on:
  workflow_dispatch:
  repository_dispatch:
    types: [source-updated]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      XDG_CACHE_HOME: /tmp/quarto-xdg
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: MohammedAliSharafuddin/digital-marketing-2026-source
          token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true

      - name: Install R packages
        shell: Rscript {0}
        run: |
          repos <- c(RSPM = Sys.getenv("RSPM",
                       unset = "https://packagemanager.posit.co/cran/__linux__/noble/latest"),
                     CRAN  = "https://cloud.r-project.org")
          install.packages(
            c("rmarkdown", "knitr", "shinylive",
              "DiagrammeR", "ggplot2", "dplyr",
              "patchwork", "bslib", "shiny", "here",
              "htmlwidgets", "scales"),
            repos = repos,
            quiet = FALSE)
          stopifnot(requireNamespace("rmarkdown", quietly = TRUE))
          stopifnot(requireNamespace("knitr",     quietly = TRUE))
          stopifnot(requireNamespace("shinylive",  quietly = TRUE))

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Activate public config (weeks 1-2 only)
        run: cp _quarto-public.yml _quarto.yml

      - name: Render book
        run: quarto render --to html

      - name: Render weekly slides (weeks 1-2)
        run: |
          for f in slides/week-01-lecture.qmd slides/week-01-tutorial.qmd \
                   slides/week-02-lecture.qmd slides/week-02-tutorial.qmd; do
            [ -f "$f" ] && quarto render "$f"
          done
          mkdir -p _book/slides
          for f in slides/week-01-lecture.html slides/week-01-tutorial.html \
                   slides/week-02-lecture.html slides/week-02-tutorial.html; do
            [ -f "$f" ] && cp "$f" _book/slides/
          done

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _book
          clean: true
          git-config-name: github-actions[bot]
          git-config-email: 41898282+github-actions[bot]@users.noreply.github.com
